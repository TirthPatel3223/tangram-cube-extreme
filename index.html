<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Twisty puzzles · 3D simulator</title>
    <meta
      name="description"
      content="Interactive 3D twisty-puzzle simulators: the DaYan Tangram Cube Extreme with 60° corner turns, Meffert's Curvy Copter and Curvy Copter Plus with curved cuts, jumbling and real bandaging, and the Maltese Gear Cube with geared 45° middle layers."
    />
    <meta name="theme-color" content="#f8f9fc" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is the default.
      // (The key changed when the default did, so a choice saved under the old dark default is dropped.)
      (function () {
        var t = 'light';
        try {
          localStorage.removeItem('theme');
          t = localStorage.getItem('theme-choice') || 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Toggle light / dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div id="app">
      <div class="stage-wrap">
        <nav class="puzzles" id="puzzles" aria-label="Puzzle"></nav>
        <main class="stage" id="stage" aria-label="3D puzzle. Click a piece to turn its highlighted part.">
          <div class="stage__tip" id="tip" hidden></div>
        </main>
      </div>
      <aside class="panel" id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
